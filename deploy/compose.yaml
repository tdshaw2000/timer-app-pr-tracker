# The Timer App PR Tracker on the VM it shares with the scramble challenge and WCA Records
# Analyser apps. Installed at /srv/timer-app-pr-tracker/compose.yaml (docs/runbook.md). Its
# own project name, so nothing here can touch another stack's containers.
#
# Settings, from /srv/timer-app-pr-tracker/.env (never committed):
#   TIMER_IMAGE   the image to run, pinned by digest; pull_deploy.py writes it
#   EDGE_NETWORK  the edge Caddy stack's Docker network, if not scramble-challenge-edge
name: timer-app-pr-tracker

services:
  web:
    image: ${TIMER_IMAGE:-ghcr.io/tdshaw2000/timer-app-pr-tracker:main}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # No ports: the edge Caddy stack reaches the app over its network by this alias.
    networks:
      edge:
        aliases:
          - timer-app-pr-tracker
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-scramble-challenge-edge}
