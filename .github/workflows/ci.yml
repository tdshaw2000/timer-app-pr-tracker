name: CI

# Every branch runs the tests and checks the image; only main publishes it and deploys. The
# deploy job never checks out this repository or holds any credential beyond a deploy key
# restricted, server-side, to one forced command (docs/runbook.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run, except on main, where the
# older run may be mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Builds the image and starts it, so a broken Dockerfile fails on its branch rather than
  # on the VM (where the pull deploy would roll it back).
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t timer-app-pr-tracker:ci .
      - run: docker compose -f deploy/compose.yaml config --quiet
      - name: Start the image and wait for its health check
        run: |
          docker run -d --name smoke timer-app-pr-tracker:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            echo "health: $status"
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker logs smoke
          [ "$status" = healthy ]

  # Publishes the image the VM pulls: amd64 for local runs, arm64 for the OCI A1 VM. The only
  # job that can write packages, with the automatic GITHUB_TOKEN.
  publish:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tdshaw2000/timer-app-pr-tracker:main
            ghcr.io/tdshaw2000/timer-app-pr-tracker:sha-${{ github.sha }}

  # Runs on a GitHub-hosted runner, never one installed on the server: on a public repo a fork
  # pull request's own copy of this workflow could otherwise target it and run arbitrary code
  # there. This hosted runner only ever SSHes out to trigger the forced-command launcher
  # (docs/runbook.md); a fork PR never has the secrets, and server-side the key can run
  # nothing but that one script.
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    # Two pushes close together must not run deploy-launcher.sh's git reset --hard
    # concurrently on the server's one checkout.
    concurrency:
      group: deploy-timer-app-pr-tracker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Pin the server's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trigger the deploy launcher on the server
        run: ssh -o BatchMode=yes "ubuntu@${{ secrets.DEPLOY_HOST }}"
