<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer App PR Tracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/js/skin.js"></script>
  <noscript><link rel="stylesheet" href="/static/themes/plain/theme.css"></noscript>
</head>
<body>
  <main>
    <header class="site-header">
      <h1><a href="/" class="site-title">Timer App PR Tracker</a></h1>
      <details class="skin-picker">
        <summary class="skin-picker-toggle" aria-label="Change skin">&#9881;</summary>
        <div class="skin-menu">
          <p class="skin-menu-title">Skin</p>
        </div>
      </details>
    </header>
    <p>
      See how your personal records progressed, from a speedcubing timer export. Your file is
      read in this browser and never uploaded.
    </p>

    <label class="upload">
      Timer export (Cubic Timer or csTimer)
      <input type="file" id="file">
    </label>
    <p id="status" role="status"></p>
    <p id="skipped" role="status" hidden></p>

    <section id="results" hidden>
      <div class="controls">
        <label>Puzzle <select id="puzzle"></select></label>
        <fieldset>
          <legend>X axis</legend>
          <label><input type="radio" name="axis" value="solve" checked> Solve number</label>
          <label><input type="radio" name="axis" value="date"> Date</label>
        </fieldset>
      </div>
      <div id="charts"></div>
    </section>
  </main>

  <script src="/static/vendor/chart.umd.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
